<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Bouncing Box</title>
  <script src="jquery.min.js"></script>
  <style>
    .box {
      width: 100px;
      height: 60px;
      background-color: #8b451f;
      background-image: linear-gradient(90deg, transparent 43%, #fff 43%, #fff 57%, transparent 57%), repeating-linear-gradient(0deg, transparent 0 7px, #fff 7px 10px, transparent 10px 17px);
      background-size: 100% 100%, 28px 46px;
      background-position: center, center;
      background-repeat: no-repeat;
      border: 2px solid #5c2d16;
      border-radius: 50%;
      box-shadow: inset -8px -5px 0 rgba(70, 28, 10, 0.25), 0 4px 8px rgba(0, 0, 0, 0.35);
      color: #fff;
      font-size: 180%;
      font-weight: bold;
      line-height: 60px;
      text-align: center;
      user-select: none;
      position: absolute;
      top: 100px;
      /* Change me! */
      left: 0px;
    }

    .board {
      height: 100vh;
      background-image: url('https://media.istockphoto.com/id/2167499398/photo/american-football-grass-field-top-view.jpg?s=612x612&w=0&k=20&c=-i_pGUn4eD6mj5aeT0ePNw-xTKnVTlhBW-deoPR6sps=');
      background-size: cover;
    }

    .score {
      color: #fff;
      font-family: sans-serif;
      font-size: 2rem;
      font-weight: bold;
      left: 50%;
      pointer-events: none;
      position: fixed;
      text-align: center;
      text-shadow: 2px 2px 4px #000;
      top: 1rem;
      transform: translateX(-50%);
      z-index: 1;
    }

    .score.final {
      font-size: clamp(3rem, 12vw, 8rem);
      top: 40%;
      transform: translate(-50%, -50%);
    }
  </style>
  <!-- 	<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/2.1.1/jquery.min.js"></script> -->
</head>

<body class="board">
  <!-- HTML for the box -->
  <div class="score">Score: <span>0</span></div>
  <div class="box">?</div>

  <script>
    (function () {
      "use strict";
      /* global jQuery */

      //////////////////////////////////////////////////////////////////
      /////////////////// SETUP DO NOT DELETE //////////////////////////
      //////////////////////////////////////////////////////////////////

      var box = jQuery(".box"); // reference to the HTML .box element
      var board = jQuery(".board"); // reference to the HTML .board element
      var score = jQuery(".score");
      var boardWidth = board.width(); // the maximum X-Coordinate of the screen
      var boardHeight = jQuery(window).height(); // the maximum Y-Coordinate of the screen

      // update the boardWidth variable when the window is resized
      jQuery(window).on("resize", function () {
        boardWidth = board.width();
        boardHeight = jQuery(window).height();
      });

      // Store the interval in a variable so it can be stopped
      var interval = setInterval(update, 50);

      // Every time the box is clicked, call the handleBoxClick Function (see below)
      box.on("click", handleBoxClick);

      // Track clicks on the board to detect mis-clicks
      board.on("click", function (event) {
        // Check if the click target is not the box
        if (event.target !== box[0]) {
          handleMisClick();
        }
      });

      // moves the Box to a new position on the screen along the X-Axis and Y-Axis
      function moveBoxTo(newPositionX, newPositionY) {
        box.css("left", newPositionX);
        box.css("top", newPositionY);
      }

      // changes the text displayed on the Box
      function changeBoxText(newText) {
        box.text(newText);
      }

      // generates a random color string in RGB format
      function getRandomColor() {
        var red = Math.random() * 255;
        var green = Math.random() * 255;
        var blue = Math.random() * 255;
        var colorStr = "rgb(" + Math.floor(red) + ", " + Math.floor(green) + ", " + Math.floor(blue) + ")";
        return colorStr;
      }

      // ends the game by stopping the update interval
      function endGame() {
        clearInterval(interval);
        console.log("You suck! Score: " + points);

        score.addClass("final").text("Final score: " + points);

        board.css("background-image", "url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6mJWJ9U5yQUbVMNJT3NCFNozmSrh8V7x7g0AqygvXUNKoY36xPmkHa1E:https://www.shutterstock.com/shutterstock/videos/30920176/thumb/9.jpg%3Fip%3Dx480&s=10')");
        board.css("background-size", "cover");
      }

      //////////////////////////////////////////////////////////////////
      /////////////////// YOUR CODE BELOW HERE /////////////////////////
      //////////////////////////////////////////////////////////////////

      // TODO 2 - Variable declarations

      var speed = 10;
      var points = 0;
      var positionX = 0;
      var positionY = 0;
      var speedY = 5;
      var misClicks = 0;



      /**
       * This Function will be called 20 times/second.
       * Each time it is called, it should move the Box to a new location.
       * If the box drifts off the screen, turn it around!
       */
      function update() {

        moveBoxTo(positionX, positionY);

        positionX = positionX + speed;
        positionY = positionY + speedY;

        if (positionX > boardWidth) {
          speed = speed * -1;
        } else if (positionX < 0) {
          speed = speed * -1;
        }

        if (positionY > boardHeight) {
          speedY = speedY * -1;
        } else if (positionY < 0) {
          speedY = speedY * -1;
        }
      }

      /**
       * This Function will be called each time the box is clicked.
       * Each time it is called, it should perform each of the following actions:
       * - increase the points total
       * - increase the speed
       * - move the box to a random location on the screen.
       * - change the box color
       * - increase speed every 3 clicks
       * - reset mis-clicks counter
       */
      function handleBoxClick() {
        // Generate random position
        positionX = Math.random() * boardWidth;
        positionY = Math.random() * boardHeight;

        // Reset mis-clicks counter
        misClicks = 0;

        // Increase points
        points += 1;
        changeBoxText(points);
        score.find("span").text(points);

        // Speed base calculation
        speed = 3 * points + 10;

        // Every 3 clicks, increase speed by 5
        if (points % 3 === 0) {
          speed += 5;
        }
      }

      /**
       * This Function will be called when the board is clicked but not the box.
       * Tracks mis-clicks and ends the game if 10 mis-clicks occur.
       */
      function handleMisClick() {
        misClicks += 1;
        console.log("Mis-clicks: " + misClicks);

        // End game if 10 mis-clicks reached
        if (misClicks >= 10) {
          endGame();
        }
      }

    })();
  </script>
</body>

</html>
